name: CartoonMania CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  refresh-data:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ripristina cache dati scraping
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/streaming_links.json
            data/streaming_links.csv
          key: cartoonmania-raw-${{ github.run_id }}
          restore-keys: |
            cartoonmania-raw-
          # Salva anche se gli step successivi falliscono: i progressi
          # parziali (es. pagina 1 scaricata prima del blocco 403) vengono
          # riusati dal run successivo invece di ripartire da zero.
          save-always: true

      - name: Estrai link di riproduzione dal sito
        shell: pwsh
        run: ./extract_links.ps1

      - name: Integra serie Loonex
        shell: pwsh
        run: ./extract_loonex.ps1

      - name: Genera catalogo compresso per l'app
        shell: pwsh
        run: ./generate_catalog.ps1

      - name: Commit e push del catalogo aggiornato
        run: |
          git config user.name "cartoonmania-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/catalog.json.gz data/catalog.version.txt app/src/main/assets/catalog.cm
          if git diff --cached --quiet; then
            echo "Nessuna modifica al catalogo"
          else
            git commit -m "chore: aggiorna catalogo $(date -u +%Y-%m-%d)"
            git push
          fi

  build-apk:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Leggi versione app
        run: echo "APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> $GITHUB_ENV

      - name: Carica APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: CartoonMania-v${{ env.APP_VERSION }}-run${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
